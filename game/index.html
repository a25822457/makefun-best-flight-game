<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Runner — a canyon flight game</title>
<!-- No libraries, no fonts, no network: the page is the canvas, the status
     line for screen readers, and the one module script that boots the game. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191325; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ridge Runner: fly the canyon, thread the rings, land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
